name: 建置會員端安裝檔（Windows + macOS）

# 用法
#   手動：GitHub → Actions → 這個 workflow → Run workflow
#   發版：推一個 v 開頭的 tag，會自動建置並建立 Release 把安裝檔掛上去
#         git tag v1.0.1 && git push origin v1.0.1
#
# 為什麼一定要用 CI 建 Windows：PyInstaller 打包的是「執行它的那台機器上的
# Python 直譯器 + 那個平台的原生模組」，沒有交叉編譯這回事。在 macOS 上
# 生不出 .exe，所以 Windows 那份只能在 Windows runner 上建。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（寫進安裝檔檔名）"
        required: false
        default: "1.2.3"
  push:
    tags:
      - "v*"

permissions:
  contents: write        # 建立 Release 要寫入權限

jobs:
  build:
    strategy:
      fail-fast: false   # Windows 掛掉不要連帶取消 macOS 那份
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安裝建置相依
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.0"

      - name: 安裝 Inno Setup（Windows 專用）
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      # 只建會員端。訊號中心跑在自己的中央機上，不發給會員 ——
      # 混進 Release 只會讓人拿錯檔案。要更新中央機就在那台跑
      # python scripts/build-release.py --central
      - name: 建置會員端
        shell: bash
        env:
          # runner 上沒有桌面，不要讓程式在冒煙測試時想開瀏覽器
          COPY_TRADER_NO_BROWSER: "1"
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyi
        run: python scripts/build-release.py

      - name: 列出產出
        shell: bash
        run: ls -la dist/installers

      - uses: actions/upload-artifact@v7
        with:
          name: 安裝檔-${{ matrix.label }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30

  release:
    # 只有推 tag 才建 Release；手動觸發就只留 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 攤平目錄
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.mq5' \) -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: true          # 先建草稿，自己確認過再按發布
          generate_release_notes: true
          body: |
            ## 安裝檔

            | 平台 | 檔案 |
            |---|---|
            | Windows | `GoldCopyTrader-Member-*-Windows.exe` |
            | macOS | `GoldCopyTrader-Member-*-macOS.dmg` |
            | MT5 EA | `MT5_File_Bridge_Enhanced.mq5` |

            檔名是英文，裝起來之後在開始功能表／應用程式裡顯示的是「黃金跟單會員端」。

            ### v1.2.3：訊號修正通知與最新版 EA

            - LINE Bot 現在會說明訊號未掛單的確切原因。
            - yuyu 明確且只有唯一解的 ±100 點位誤植可安全修正；修正前後數值會顯示在通知。
            - 安裝產物另外提供獨立 EA，且安裝包內也包含同一份最新版。

            ### 本金比例動態手數

            旗艦版可在每個訊號來源選擇「本金比例」，由會員自己的 MT5 餘額／淨值、
            訊號進場價與停損距離動態計算手數。其他方案可看見選項，但會鎖定。

            **本版更新了 `MT5_File_Bridge_Enhanced.mq5`。使用動態手數前，請下載獨立 EA
            （或從安裝包內取得），複製到 MT5，並在 MetaEditor 按 F7 重新編譯、重新掛載。**

            ### 安裝前請先看

            這兩個平台的安裝檔都**未經數位簽章**（需要付費憑證），
            第一次開啟時系統會出現警告，這是預期的，不是程式有問題：

            - **Windows**：藍色的「已保護您的電腦」→ 按「其他資訊」→「仍要執行」
            - **macOS**：「無法打開，因為無法驗證開發者」→ 在應用程式上**按右鍵→打開**

            完整步驟與 MT5 EA 的安裝方式見 [安裝說明](docs/安裝說明.md)。
