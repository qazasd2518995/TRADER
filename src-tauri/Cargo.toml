[package]
name = "gold-copy-trader"
version = "1.0.0"
description = "黃金跟單系統"
authors = ["you"]
edition = "2021"

[lib]
name = "gold_copy_trader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
