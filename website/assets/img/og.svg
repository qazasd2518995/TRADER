      <stop offset=".52" stop-color="#D4A017"/><stop offset=".78" stop-color="#A87C10"/>
      <stop offset="1" stop-color="#F0C65C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".85">
